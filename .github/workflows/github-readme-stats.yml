name: 更新 GitHub 统计卡片

on:
  # 每天 UTC 00:00 执行
  # 北京时间 / UTC+8 为每天 08:00
  schedule:
    - cron: "0 0 * * *"

  # 支持手动执行
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 生成 GitHub 统计卡片
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&icon_color=333333&text_color=333333&bg_color=ffffff&title_color=333333&count_private=true&locale=cn
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成常用语言卡片
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&langs_count=8&icon_color=333333&text_color=333333&bg_color=ffffff&title_color=333333&locale=cn
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交统计卡片
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "统计数据没有变化，无需提交"
            exit 0
          fi

          git commit -m "chore: 更新 GitHub 统计卡片"
          git push
